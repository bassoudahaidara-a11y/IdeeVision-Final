name: Idée Vision — Vérification de l'étape 1 (sans compilation APK)
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Vérifier la syntaxe des moteurs JavaScript
        shell: bash
        run: |
          set -e
          find app/src/main/assets -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            echo "Vérification : $file"
            node --check "$file"
          done
      - name: Exécuter tous les tests automatisés
        run: node --test tests/*.test.js
