name: Idée Vision — Tests et APK de contrôle
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Installer le support IndexedDB des tests
        run: npm install --no-save fake-indexeddb@6
      - name: Vérifier la syntaxe de tous les moteurs JavaScript
        shell: bash
        run: |
          set -e
          for file in app/src/main/assets/engine/*.js; do
            echo "Vérification : $file"
            node --check "$file"
          done
      - name: Exécuter tous les tests automatisés
        run: node --test tests/*.test.js
      - name: Installer Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Compiler l'APK de vérification
        run: gradle assembleDebug --no-daemon
      - name: Publier l'APK de vérification
        uses: actions/upload-artifact@v4
        with:
          name: Idee-Vision-1.10.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
