name: Offline engine tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tests/json-engine-v2-1.test.js
      - run: node tests/offline-scene-engine.test.js
      - run: node tests/french-understanding.test.js
      - run: node tests/idea-understanding-contract.test.js
      - run: node tests/knowledge-manager.test.js
      - run: node tests/french-corpus.test.js
      - run: node tests/french-corpus-splits.test.js

  android-debug-apk:
    if: github.ref == 'refs/heads/offline-2d3d-phases-1-5' || github.head_ref == 'offline-2d3d-phases-1-5'
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: IdeeVision-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
